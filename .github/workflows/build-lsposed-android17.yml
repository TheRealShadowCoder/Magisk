name: Build LSPosed descendant for Android 17

on:
  push:
    branches:
      - lsposed-android17-build
    paths:
      - ".github/workflows/build-lsposed-android17.yml"
      - "LSPosed-Android17/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 17 Zygisk module
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout Vector (maintained LSPosed-derived Android 17 engine)
        uses: actions/checkout@v4
        with:
          repository: JingMatrix/Vector
          ref: canary-3119
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Record source revision
        run: |
          git rev-parse HEAD
          git submodule status --recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: 1.13.2

      - name: Configure build
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "android.native.buildOutput=verbose" >> ~/.gradle/gradle.properties
          rm -rf "$ANDROID_HOME/cmake"

      - name: Compile Zygisk release and debug
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon zipAll

      - name: Verify module artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(zygisk/release/Vector-v*-Release.zip zygisk/release/Vector-v*-Debug.zip)
          [ "${#files[@]}" -eq 2 ] || { echo "Expected 2 module zips, found ${#files[@]}"; exit 1; }
          for file in "${files[@]}"; do
            unzip -t "$file" | tail -2
            unzip -p "$file" module.prop | grep -E '^(id|name|version|versionCode)='
            sha256sum "$file"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          git rev-parse HEAD > BUILT_FROM_COMMIT.txt

      - name: Upload installable Android 17 Zygisk modules
        uses: actions/upload-artifact@v4
        with:
          name: LSPosed-Android17-Vector-3119-Zygisk
          if-no-files-found: error
          retention-days: 30
          path: |
            zygisk/release/Vector-v*-Release.zip
            zygisk/release/Vector-v*-Debug.zip
            SHA256SUMS.txt
            BUILT_FROM_COMMIT.txt
