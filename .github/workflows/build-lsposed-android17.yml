name: Build and validate Android 17 Xposed framework (Vector)

on:
  push:
    branches: [lsposed-android17-build]
    paths:
      - ".github/workflows/build-lsposed-android17.yml"
      - "LSPosed-Android17/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout our build and verification files
        uses: actions/checkout@v4
        with:
          path: support
          persist-credentials: false

      - name: Checkout pinned modern LSPosed descendant and all submodules
        uses: actions/checkout@v4
        with:
          repository: JingMatrix/Vector
          ref: 6f6b976e3315c158d501f743c3c609e80cae7ec8
          submodules: recursive
          fetch-depth: 0
          path: vector
          persist-credentials: false

      - name: Verify fixed source revision and API 37 build configuration
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f6b976e3315c158d501f743c3c609e80cae7ec8"
          # Vector derives versionCode from origin/master, not HEAD. Pin this
          # local CI ref to the checked-out revision to avoid stamping a newer code
          # than the actual source. No remote branch is modified.
          git update-ref refs/remotes/origin/master "$(git rev-parse HEAD)"
          test "$(git rev-list --count refs/remotes/origin/master)" = "3119"
          grep -Eq 'val androidCompileSdkVersion = 37' build.gradle.kts
          grep -Eq 'val androidTargetSdkVersion = 37' build.gradle.kts
          git submodule status --recursive
          if git submodule status --recursive | grep -qE '^[-+]'; then
            echo "::error::Missing or mismatched source submodule"
            exit 1
          fi

      - name: Unit-test Magisk Zygisk / ReZygisk provider matrix (API 37)
        shell: bash
        run: |
          set -euo pipefail
          sh -n support/LSPosed-Android17/provider/a17-provider-guard.sh
          sh -n support/LSPosed-Android17/provider/a17-provider-control.sh
          sh -n support/LSPosed-Android17/provider/test-provider-matrix.sh
          sh -n support/LSPosed-Android17/provider/test-provider-selector.sh
          (
            cd support/LSPosed-Android17/provider
            sh ./test-provider-matrix.sh
            sh ./test-provider-selector.sh
          )

      - name: Stage verified provider guard in the Zygisk module source
        shell: bash
        run: |
          set -euo pipefail
          cp support/LSPosed-Android17/provider/a17-provider-guard.sh vector/zygisk/module/a17-provider-guard.sh
          cp support/LSPosed-Android17/provider/a17-provider-control.sh vector/zygisk/module/a17-provider-control.sh
          cp support/LSPosed-Android17/provider/ZygiskProviderControl.kt vector/daemon/src/main/kotlin/org/matrix/vector/daemon/utils/ZygiskProviderControl.kt
          cp support/LSPosed-Android17/provider/ZygiskProviderSettings.kt vector/manager/src/main/kotlin/org/matrix/vector/manager/ui/screens/home/ZygiskProviderSettings.kt

      - name: Apply Android 17 Zygisk provider installation compatibility patch
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          patch="../support/LSPosed-Android17/patches/1110-android17-zygisk-provider-guard.patch"
          git apply --check "$patch"
          git apply "$patch"
          sh -n zygisk/module/customize.sh
          sh -n zygisk/module/a17-provider-guard.sh
          sh -n zygisk/module/a17-provider-control.sh
          grep -q 'a17_provider_preflight' zygisk/module/customize.sh
          grep -q 'a17-provider-control.sh' zygisk/module/customize.sh
          echo "Android 17 install-time dual-provider guard staged; runtime tests still required."

      - name: Compile manager UI and new daemon IPC for provider selection
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          patch="../support/LSPosed-Android17/patches/1120-android17-provider-settings-ui.patch"
          git apply --check "$patch"
          git apply "$patch"
          grep -q 'const int PROTOCOL_VERSION = 4' services/manager-service/src/main/aidl/org/matrix/vector/ipc/IManagerService.aidl
          grep -q 'selectZygiskProvider' services/manager-service/src/main/aidl/org/matrix/vector/ipc/IManagerService.aidl
          grep -q 'ZygiskProviderSettings' manager/src/main/kotlin/org/matrix/vector/manager/ui/screens/home/SystemStatusScreen.kt
          grep -q 'ZygiskProviderControl' daemon/src/main/kotlin/org/matrix/vector/daemon/ipc/ManagerService.kt
          echo "Manager / daemon IPC and Android 17 Zygisk provider menu staged."

      - name: Keep demo builds safe with provider selection stubs
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          patch="../support/LSPosed-Android17/patches/1121-provider-demo-stub.patch"
          git apply --check "$patch"
          git apply "$patch"
          grep -q 'Provider switching disabled in demo mode' manager/src/debug/kotlin/org/matrix/vector/manager/demo/FakeManagerService.kt

      - name: Apply experimental generation-retirement patch for Android 17
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          patch="../support/LSPosed-Android17/patches/1024-module-generation-leak.patch"
          git apply --check "$patch"
          git apply "$patch"
          grep -q 'ModuleAppService.forgetReplacedModules(newModules)' daemon/src/main/kotlin/org/matrix/vector/daemon/data/ConfigCache.kt
          grep -q 'serviceMap = ConcurrentHashMap<String, ModuleAppService>()' daemon/src/main/kotlin/org/matrix/vector/daemon/ipc/ModuleAppService.kt
          echo "Applied candidate upstream PR #1024; not a verified runtime fix."

      - name: Apply Android 17 manager and package-discovery reliability patch
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          patch="../support/LSPosed-Android17/patches/1099-manager-discovery-consistency.patch"
          git apply --check "$patch"
          git apply "$patch"
          grep -q 'private val scanGeneration = AtomicInteger(0)' manager/src/main/kotlin/org/matrix/vector/manager/ui/screens/modules/ModulesViewModel.kt
          grep -q 'preserving the last successful module list' manager/src/main/kotlin/org/matrix/vector/manager/ui/screens/modules/ModulesViewModel.kt
          grep -q 'Component lookup failed' daemon/src/main/kotlin/org/matrix/vector/daemon/system/SystemExtensions.kt
          echo "Applied candidate consistency fixes for #1099 and partial #1098."

      - name: Prevent false-empty module scans during Android service startup
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          patch="../support/LSPosed-Android17/patches/1099-fail-closed-on-missing-package-manager.patch"
          git apply --check "$patch"
          git apply "$patch"
          grep -q 'PackageManager not initialized' daemon/src/main/kotlin/org/matrix/vector/daemon/ipc/ManagerService.kt
          git diff --check
          echo "Staged a fail-closed Binder response when Android PackageManager is not ready."

      - name: Check Android 17 port source invariants before compiling
        shell: bash
        run: |
          set -euo pipefail
          python3 support/LSPosed-Android17/ci_assert_port.py vector API37_SOURCE_TESTS.json

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: 1.13.2

      - name: Compile Android 17 Zygisk modules and manager
        shell: bash
        working-directory: vector
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          rm -rf "$ANDROID_HOME/cmake"
          chmod +x ./gradlew
          ./gradlew --no-daemon zipAll

      - name: Extract both build variants and APK from module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          release=$(find vector/zygisk/release -maxdepth 1 -name 'Vector-v*-Release.zip' -print -quit)
          debug=$(find vector/zygisk/release -maxdepth 1 -name 'Vector-v*-Debug.zip' -print -quit)
          test -n "$release"
          test -n "$debug"
          cp "$release" artifact/
          cp "$debug" artifact/
          unzip -p "$release" manager.apk > artifact/Vector-Android17-Manager.apk
          unzip -p "$release" daemon.apk > artifact/Vector-Android17-Daemon.apk
          test -s artifact/Vector-Android17-Manager.apk
          test -s artifact/Vector-Android17-Daemon.apk
          for module_zip in artifact/Vector-v*-Release.zip artifact/Vector-v*-Debug.zip; do
            unzip -Z1 "$module_zip" | grep -Fx 'a17-provider-guard.sh'
            unzip -Z1 "$module_zip" | grep -Fx 'a17-provider-guard.sh.sha256'
            unzip -Z1 "$module_zip" | grep -Fx 'a17-provider-control.sh'
            unzip -Z1 "$module_zip" | grep -Fx 'a17-provider-control.sh.sha256'
            unzip -p "$module_zip" customize.sh | grep -q 'a17_provider_preflight'
            unzip -p "$module_zip" a17-provider-control.sh | grep -q 'a17_apply'
          done
          printf '%s\n' 'Magisk built-in Zygisk: requires standalone provider OFF; API 37 device hook test pending' > artifact/ZYGISK_PROVIDER_MATRIX.txt
          printf '%s\n' 'ReZygisk: requires Magisk built-in Zygisk OFF; API 37 zygote_next unresolved upstream' >> artifact/ZYGISK_PROVIDER_MATRIX.txt
          printf '%s\n' 'Auto default chooses built-in Magisk if functioning; otherwise installed ReZygisk.' >> artifact/ZYGISK_PROVIDER_MATRIX.txt
          printf '%s\n' 'Choices are stored by the root daemon; switching is staged for next boot only.' >> artifact/ZYGISK_PROVIDER_MATRIX.txt
          printf '%s\n' 'One active provider only; actual injection has not been verified.' >> artifact/ZYGISK_PROVIDER_MATRIX.txt
          sha256sum artifact/*.zip artifact/*.apk > artifact/SHA256SUMS.txt
          git -C vector rev-parse HEAD > artifact/SOURCE_REVISION.txt
          cp API37_SOURCE_TESTS.json artifact/API37_SOURCE_TESTS.json
          printf '%s\n' 'UNMERGED upstream candidate PR: https://github.com/JingMatrix/Vector/pull/1024' > artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/patches/1024-module-generation-leak.patch >> artifact/APPLIED_SOURCE_PATCHES.txt
          printf '%s\n' 'CANDIDATE manager discovery consistency; not upstream validated' >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/patches/1099-manager-discovery-consistency.patch >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/patches/1099-fail-closed-on-missing-package-manager.patch >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/patches/1110-android17-zygisk-provider-guard.patch >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/provider/a17-provider-guard.sh >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/provider/a17-provider-control.sh >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/patches/1120-android17-provider-settings-ui.patch >> artifact/APPLIED_SOURCE_PATCHES.txt
          sha256sum support/LSPosed-Android17/patches/1121-provider-demo-stub.patch >> artifact/APPLIED_SOURCE_PATCHES.txt

      - name: Validate native ABIs, sha256 manifests, and ELF 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 support/LSPosed-Android17/ci_verify.py \
            "$(ls artifact/Vector-v*-Release.zip)" artifact/ANDROID17_RELEASE_STATIC_REPORT.json
          python3 support/LSPosed-Android17/ci_verify.py \
            "$(ls artifact/Vector-v*-Debug.zip)" artifact/ANDROID17_DEBUG_STATIC_REPORT.json

      - name: Verify APK signing (not a runtime compatibility guarantee)
        shell: bash
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose artifact/Vector-Android17-Manager.apk
          "$signer" verify --verbose artifact/Vector-Android17-Daemon.apk

      - name: Record certification boundary
        shell: bash
        run: |
          cat > artifact/ANDROID17_DEVICE_TEST_REQUIRED.txt <<'EOF'
          GITHUB ACTIONS RESULT = PATCHED SOURCE BUILD + STATIC PACKAGE VERIFICATION ONLY.
          Candidate unmerged upstream PR #1024 applied to reduce obsolete module references.
          Android 17 runtime compatibility has NOT been certified.
          Both Magisk built-in Zygisk and ReZygisk setups require independent on-device tests.
          Magisk built-in Zygisk and ReZygisk must NOT be activated together.
          Manager menu supports Auto, built-in Zygisk, or ReZygisk on API 37.
          Auto stages Magisk if functioning; otherwise ReZygisk, if installed.
          Provider switches require a REBOOT; the manager never auto-reboots.
          To verify a full port: boot on SDK 37, start Zygisk, verify daemon
          and manager operation, run real module hook, test system_server, and
          prove recovery from failed hooks. See validation kit.
          Original LSPosed 1.9.2 source has NOT been ported by this workflow;
          it builds the maintained LSPosed-derived Vector framework.
          EOF

      - name: Upload verification-gated build output
        uses: actions/upload-artifact@v4
        with:
          name: Android17-Vector-3119-PROVIDER-SELECTOR-UNVERIFIED
          path: artifact/
          if-no-files-found: error
          retention-days: 30
